<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>演習評核</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#f7f5ee;color:#161512}
select{font-family:inherit;cursor:pointer}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f5ee; display: flex; flex-direction: column; overflow: hidden;">

<sc-if value="{{ showLoading }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex-grow: 1; padding: 40px 32px; box-sizing: border-box; text-align: center;">
  <div style="font-size: 17px; font-weight: 700; color: #161512;">資料載入中…</div>
</div>
</sc-if>

<sc-if value="{{ showLoadError }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex-grow: 1; padding: 40px 32px; box-sizing: border-box; text-align: center;">
  <div style="font-size: 17px; font-weight: 700; color: #b00020;">資料載入失敗</div>
  <div style="font-size: 14px; line-height: 1.5; color: #3a382f;">{{ loadError }}</div>
  <button type="button" onClick="{{ retryLoad }}" style="margin-top: 8px; height: 48px; padding: 0 24px; border: 2px solid #d8d2bf; border-radius: 24px; background: #ffffff; color: #161512; font-size: 15px; font-weight: 700;">重新載入</button>
</div>
</sc-if>

<sc-if value="{{ showSelect }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 40px 24px 18px; box-sizing: border-box;">
    <div style="font-size: 13px; font-weight: 700; color: #8a5a1e; letter-spacing: 1px;">演習名稱</div>
    <div style="font-size: 25px; font-weight: 900; line-height: 1.3;">{{ exerciseName }}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 24px 18px; box-sizing: border-box;">
    <label for="fillerCode" style="font-size: 15px; font-weight: 700; color: #161512;">填寫人員代號</label>
    <div style="position: relative;">
      <select id="fillerCode" onChange="{{ setCode }}" value="{{ fillerCode }}" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 44px 0 16px; font-size: 17px; font-weight: 500; color: #161512; background: #ffffff; border: 2px solid #d8d2bf; border-radius: 14px; appearance: none; outline: none;">
        <option value="">請選擇代號</option>
        <sc-for list="{{ codes }}" as="c" hint-placeholder-count="5">
          <option value="{{ c.value }}">{{ c.label }}</option>
        </sc-for>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161512" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
    <sc-if value="{{ showCodeHint }}" hint-placeholder-val="{{ false }}">
    <div style="font-size: 13px; font-weight: 700; color: #b00020;">請先選擇填寫人員代號</div>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 24px 24px; box-sizing: border-box; flex-grow: 1; overflow: auto;">
    <div style="font-size: 15px; font-weight: 700; color: #161512;">選擇評核項目</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="9">
        <button type="button" onClick="{{ it.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; aspect-ratio: 1; padding: 10px; background: #ffffff; border: 2px solid #d8d2bf; border-radius: 16px; color: #161512;">
          <div style="width: 42px; height: 42px; border-radius: 10px; background: #f0e2be; display: flex; align-items: center; justify-content: center; color: #7a4e0f;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </div>
          <div style="font-size: 13px; font-weight: 700; text-align: center; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{ it.label }}</div>
        </button>
      </sc-for>
    </div>
  </div>

</div>
</sc-if>

<sc-if value="{{ showCriteria }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">

  <div style="display: flex; align-items: center; gap: 4px; padding: 14px 12px; box-sizing: border-box; flex-shrink: 0;">
    <button type="button" onClick="{{ backToSelect }}" aria-label="返回" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #161512; flex-shrink: 0;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="font-size: 18px; font-weight: 900; flex-grow: 1; text-align: center; padding-right: 56px;">{{ itemName }}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 4px 24px 20px; box-sizing: border-box; flex-grow: 1; overflow: auto;">
    <div style="font-size: 21px; font-weight: 900;">評分標準說明</div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{ criteria }}" as="c" hint-placeholder-count="5">
        <div style="display: flex; align-items: flex-start; gap: 14px; padding: 16px; background: #ffffff; border: 2px solid #d8d2bf; border-radius: 16px;">
          <div style="width: 44px; height: 44px; border-radius: 22px; background: #161512; color: #ffffff; font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ c.score }}</div>
          <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px;">
            <div style="font-size: 16px; font-weight: 700;">{{ c.label }}</div>
            <div style="font-size: 14px; line-height: 1.5; color: #3a382f;">{{ c.desc }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 24px 28px; box-sizing: border-box; background: #f7f5ee; border-top: 2px solid #e6e0cf; flex-shrink: 0;">
    <button type="button" onClick="{{ goSurvey }}" style="width: 100%; height: 58px; border: 0; border-radius: 29px; font-size: 18px; font-weight: 900; background: #161512; color: #ffffff;">開始評分</button>
  </div>

</div>
</sc-if>

<sc-if value="{{ showSurvey }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">

  <div style="display: flex; align-items: center; gap: 4px; padding: 14px 12px; box-sizing: border-box; flex-shrink: 0; border-bottom: 2px solid #e6e0cf;">
    <button type="button" onClick="{{ backToCriteria }}" aria-label="返回" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #161512; flex-shrink: 0;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="font-size: 18px; font-weight: 900; flex-grow: 1; text-align: center; padding-right: 56px;">{{ itemName }}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 20px; box-sizing: border-box; flex-grow: 1; overflow: auto;">
    <sc-for list="{{ questions }}" as="q" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #ffffff; border: 2px solid #d8d2bf; border-radius: 16px;">
        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <div style="font-size: 13px; font-weight: 900; color: #7a4e0f; padding-top: 2px;">{{ q.id }}</div>
          <div style="font-size: 16px; font-weight: 700; line-height: 1.4;">{{ q.text }}</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{ q.options }}" as="o" hint-placeholder-count="5">
            <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.n }}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 24px 28px; box-sizing: border-box; background: #f7f5ee; border-top: 2px solid #e6e0cf; flex-shrink: 0;">
    <sc-if value="{{ showSubmitError }}" hint-placeholder-val="{{ false }}">
    <div style="margin-bottom: 10px; padding: 12px 14px; background: #fdeaea; border: 2px solid #f0bcbc; border-radius: 14px; font-size: 13px; line-height: 1.5; color: #b00020;">送出失敗，評分未寫入。請確認網路後再按一次送出。（{{ submitError }}）</div>
    </sc-if>
    <button type="button" onClick="{{ submit }}" disabled="{{ submitDisabled }}" style="{{ submitStyle }}">{{ submitLabel }}</button>
  </div>

</div>
</sc-if>

<sc-if value="{{ showDone }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; flex-grow: 1; padding: 40px 32px; box-sizing: border-box; text-align: center;">
  <div style="width: 96px; height: 96px; border-radius: 48px; background: #dcefe3; color: #1f7a4d; display: flex; align-items: center; justify-content: center;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
  </div>
  <div style="font-size: 25px; font-weight: 900;">評核已送出！</div>
  <div style="font-size: 16px; line-height: 1.6; color: #3a382f;">{{ itemName }}</div>
  <button type="button" onClick="{{ reset }}" style="margin-top: 12px; height: 56px; padding: 0 30px; border: 2px solid #d8d2bf; border-radius: 28px; background: #ffffff; color: #161512; font-size: 16px; font-weight: 700;">返回選擇項目</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#161512","options":["#161512","#7a4e0f","#1f7a4d","#2b5fd9"]},"$preview":{"width":390,"height":844}}'>
const CONFIG_URL = 'https://script.google.com/macros/s/AKfycbwNkZFG97TRdrB1NKqWFWasuMOMYn-Hf6b4M6UOZFK59mwM9DO0-qnWYa96n9ZPhiVuwA/exec';
const RECORD_URL = 'https://script.google.com/macros/s/AKfycbwIoR80BmRBvRWM2-dRrUcN0R6gEL_In1Ko4sBqbCBaixdgl_EDwOYgg5C-0Aft-yYx/exec';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: 'select', fillerCode: '', selectedItem: null, answers: {}, config: null, loadError: null, codeHint: false, submitting: false, submitError: null };
    this.submissionId = null;
  }
  componentDidMount() {
    this.loadConfig();
  }
  loadConfig() {
    this.setState({ config: null, loadError: null });
    fetch(CONFIG_URL)
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => this.setState({ config: data }))
      .catch((err) => this.setState({ loadError: (err && err.message) || String(err) }));
  }
  postSubmission(payload) {
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), 20000) : null;
    return fetch(RECORD_URL, {
      method: 'POST',
      // text/plain 避免觸發 CORS preflight，Apps Script 不回應 OPTIONS。
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow',
      signal: controller ? controller.signal : undefined,
    })
      .then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then((data) => {
        if (!data || !data.ok) throw new Error((data && data.error) || '寫入失敗');
        return data;
      })
      .finally(() => { if (timer) clearTimeout(timer); });
  }
  postWithRetry(payload, attempt) {
    return this.postSubmission(payload).catch((err) => {
      if (attempt >= 3) throw err;
      return new Promise((r) => setTimeout(r, 800 * attempt)).then(() => this.postWithRetry(payload, attempt + 1));
    });
  }
  submitScores() {
    const item = this.state.config.items[this.state.selectedItem];
    const answers = this.state.answers;
    if (!this.submissionId) {
      this.submissionId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }
    const payload = {
      submissionId: this.submissionId,
      fillerCode: this.state.fillerCode,
      itemName: item.name,
      answers: item.questions.map((q) => ({ id: q.id, score: answers[q.id] })),
    };
    this.setState({ submitting: true, submitError: null });
    this.postWithRetry(payload, 1)
      .then(() => {
        this.submissionId = null;
        this.setState({ submitting: false, screen: 'done' });
      })
      .catch((err) => this.setState({ submitting: false, submitError: (err && err.message) || String(err) }));
  }
  renderVals() {
    const accent = this.props.accent ?? '#161512';
    const screen = this.state.screen;
    const config = this.state.config;
    const loaded = !!config;
    const codes = loaded ? config.codes : [];
    const configItems = loaded ? config.items : [];
    const items = configItems.map((it, idx) => ({
      label: it.name.replace(/^SCENE\s*/i, ''),
      pick: () => {
        if (!this.state.fillerCode) return this.setState({ codeHint: true });
        this.submissionId = null;
        this.setState({ selectedItem: idx, screen: 'criteria', answers: {}, submitError: null });
      },
    }));
    const selected = this.state.selectedItem !== null ? configItems[this.state.selectedItem] : null;
    const itemName = selected ? selected.name : '';
    const itemQuestions = selected ? selected.questions : [];
    const answers = this.state.answers;
    const questions = itemQuestions.map((q) => {
      const current = answers[q.id];
      const options = [1, 2, 3, 4, 5].map((n) => {
        const on = current === n;
        return {
          n,
          pick: () => this.setState({ answers: { ...answers, [q.id]: n } }),
          style: 'height: 56px; border-radius: 14px; font-size: 17px; font-weight: 900; border: 2px solid ' +
            (on ? accent : '#d8d2bf') + '; background: ' + (on ? accent : '#ffffff') + '; color: ' + (on ? '#ffffff' : '#161512') + ';',
        };
      });
      return { id: q.id, text: q.text, options };
    });
    const answeredCount = itemQuestions.filter((q) => answers[q.id] != null).length;
    const totalCount = itemQuestions.length;
    const ready = totalCount > 0 && answeredCount === totalCount && !!this.state.fillerCode;
    const canSubmit = ready && !this.state.submitting;
    return {
      exerciseName: loaded ? config.exerciseName : '',
      codes,
      items,
      itemName,
      criteria: loaded ? config.criteria : [],
      questions,
      answeredCount,
      totalCount,
      fillerCode: this.state.fillerCode,
      setCode: (e) => this.setState({ fillerCode: e && e.target ? e.target.value : '', codeHint: false }),
      showCodeHint: this.state.codeHint && !this.state.fillerCode,
      showLoading: !loaded && !this.state.loadError,
      showLoadError: !!this.state.loadError,
      loadError: this.state.loadError || '',
      retryLoad: () => this.loadConfig(),
      showSelect: loaded && screen === 'select',
      showCriteria: loaded && screen === 'criteria',
      showSurvey: loaded && screen === 'survey',
      showDone: loaded && screen === 'done',
      backToSelect: () => this.setState({ screen: 'select' }),
      backToCriteria: () => this.setState({ screen: 'criteria' }),
      goSurvey: () => this.setState({ screen: 'survey' }),
      submitDisabled: !canSubmit,
      submitLabel: this.state.submitting
        ? '送出中…'
        : (this.state.submitError ? '重新送出' : '送出評核（' + answeredCount + '/' + totalCount + '）'),
      submitStyle: 'width: 100%; height: 58px; border: 0; border-radius: 29px; font-size: 17px; font-weight: 900; background: ' +
        (canSubmit ? accent : '#d8d2bf') + '; color: ' + (canSubmit ? '#ffffff' : '#8a867c') + ';',
      showSubmitError: !!this.state.submitError && !this.state.submitting,
      submitError: this.state.submitError || '',
      submit: () => { if (canSubmit) this.submitScores(); },
      reset: () => {
        this.submissionId = null;
        this.setState({ screen: 'select', selectedItem: null, answers: {}, submitError: null });
      },
    };
  }
}
</script>
</body>
</html>
